name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DropZone.slnx

      - name: Build
        run: dotnet build DropZone.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test DropZone.slnx --configuration Release --no-build --verbosity normal

      - name: Publish
        run: >
          dotnet publish src/DropZone.App/DropZone.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          --output publish

      - name: Publish the MCP server alongside it
        run: >
          dotnet publish src/DropZone.Mcp/DropZone.Mcp.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          -p:PublishSingleFile=true
          --output publish

      - name: Stage installer scripts alongside the build
        run: |
          Copy-Item install.ps1 publish/
          Copy-Item uninstall.ps1 publish/
          Copy-Item README.md publish/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DropZone-win-x64
          path: publish/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DropZone-win-x64
          path: publish

      - name: Zip it
        run: cd publish && zip -r ../DropZone-win-x64.zip .

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: DropZone-win-x64.zip
          generate_release_notes: true
